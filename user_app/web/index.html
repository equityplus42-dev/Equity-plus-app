<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vridhi Network">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vridhi Network</title>
  <link rel="manifest" href="manifest.json">
  <!-- Razorpay Official Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function launchRazorpayCheckout(keyId, orderId, amount, name, description, userEmail, userPhone, onSuccess, onError) {
      try {
        var options = {
          "key": keyId,
          "amount": amount,
          "currency": "INR",
          "name": name || "Equity Plus",
          "description": description || "Membership Activation",
          "order_id": orderId,
          "prefill": {
            "email": userEmail || "",
            "contact": userPhone || ""
          },
          "theme": {
            "color": "#7C3AED"
          },
          "handler": function (response) {
            console.log("[Razorpay Success]", response);
            if (onSuccess) {
              onSuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
            }
          },
          "modal": {
            "ondismiss": function() {
              console.log("[Razorpay Dismissed]");
              if (onError) {
                onError("Payment modal dismissed by user.");
              }
            }
          }
        };
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          console.error("[Razorpay Failed]", response);
          if (onError) {
            onError(response.error.description || "Payment process failed.");
          }
        });
        rzp.open();
      } catch (err) {
        console.error("[Razorpay Launch Error]", err);
        if (onError) {
          onError("Could not open Razorpay checkout popup: " + err.message);
        }
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
